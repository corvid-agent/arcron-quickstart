name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Static hook checks
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest tests/ -q
      - name: Compile the target
        run: |
          python -m puyapy contracts/minimal_target.py --out-dir artifacts
